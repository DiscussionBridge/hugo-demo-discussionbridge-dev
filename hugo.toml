baseURL = 'https://hugo.demo.discussionbridge.dev/'
locale = 'en-US'
title = 'DiscussionBridge Hugo Demo'
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = 'github.com/gohugo-ananke/ananke/v2'

[params]
  description = 'A stock Hugo site connected to The Bridge.'
  discussionbridge_forum_origin = 'https://bridge.demo.discussionbridge.dev'
  site_logo = ''
  recent_posts_number = 8

[params.ananke]
  custom_css = ['discussionbridge.css']

[params.ananke.social.follow]
  networks = ['discourse', 'bluesky', 'discord', 'mastodon', 'reddit', 'x-twitter', 'youtube']

[params.ananke.social.networks.discourse]
  slug = 'discourse'
  label = 'DiscussionBridge forum'
  color = '#0b5360'
  profile = ''
  icon = 'discourse'

[params.ananke.social.networks.discord]
  slug = 'discord'
  label = 'Discord'
  color = '#5865f2'
  profile = ''
  icon = 'discord'

[params.ananke.social.discourse]
  profilelink = 'https://forum.discussionbridge.dev/'

[params.ananke.social.bluesky]
  username = 'discussionbridge.bsky.social'

[params.ananke.social.discord]
  profilelink = 'https://discord.gg/Y7SRQAxKq'

[params.ananke.social.mastodon]
  profilelink = 'https://mastodon.social/@DiscussionBridge'

[params.ananke.social.reddit]
  profilelink = 'https://www.reddit.com/r/DiscussionBridge/'

[params.ananke.social.x-twitter]
  profilelink = '#'

[params.ananke.social.youtube]
  username = 'DiscussionBridge'

[mediaTypes.'application/vnd.discussionbridge+json']
  suffixes = ['json']

[outputFormats.discussionbridge]
  mediaType = 'application/vnd.discussionbridge+json'
  baseName = 'discussionbridge-manifest'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['html', 'rss', 'discussionbridge']

[[menus.main]]
  name = 'Hugo demos'
  pageRef = '/discussionbridge'
  weight = 10

[[menus.main]]
  name = 'All demos'
  url = 'https://demo.discussionbridge.dev/'
  weight = 20

[[menus.main]]
  name = 'Publisher matrix'
  url = 'https://demo.discussionbridge.dev/discourse/'
  weight = 30

[[menus.main]]
  name = 'The Bridge'
  url = 'https://bridge.demo.discussionbridge.dev/'
  weight = 40
